    <style>


        :root {

            --vinho-alexandria: #8b1e2d;

            --vinho-escuro: #5e1220;

            --dourado-alexandria: #d4af37;

            --dourado-claro: #f0d060;

            --bege-fundo: #f5efe6;

            --bege-card: #fdf8f2;

            --preto-contraste: #1a1a1a;

            --cinza-destaque: #dee0e3;

            --cinza-texto: #555;

            --branco: #ffffff;

        }

        * {

            margin: 0;

            padding: 0;

            box-sizing: border-box;

        }


        html,
        body {

            width: 100%;

            min-height: 100%;

            font-family: Arial, Helvetica, sans-serif;

            background: var(--branco);

        }

        .topbar {

            width: 100%;

            height: 43px;

            background: var(--vinho-alexandria);

            display: flex;

            align-items: center;

            justify-content: space-between;

            color: white;

            padding: 0 8px;

            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);

            position: fixed;

            top: 0;

            left: 0;

            z-index: 1000;

        }


        .topbar-left {

            height: 100%;

            display: flex;

            align-items: center;

        }


        /* BOTÃO MENU */

        .menu-button {

            width: 32px;

            height: 32px;

            display: flex;

            align-items: center;

            justify-content: center;

            border: 1px solid rgba(255,255,255,0.8);

            border-radius: 4px;

            background: transparent;

            color: white;

            margin-right: 20px;

            cursor: pointer;

        }


        .menu-button i {

            font-size: 20px;

        }


        .page-title {

            font-size: 12px;

            font-weight: 600;

            white-space: nowrap;

        }


        .topbar-right {

            display: flex;

            align-items: center;

            height: 100%;

            gap: 10px;

        }


        .topbar-icon {

            width: 28px;

            height: 30px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: transparent;

            border: none;

            color: white;

            cursor: pointer;

        }


        .topbar-icon i {

            font-size: 16px;

        }

        .page {

            width: 100%;

            min-height: 100vh;

            padding-top: 43px;

            display: flex;

        }

        .menu-overlay {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100vh;

            background: rgba(0, 0, 0, 0.45);

            z-index: 1999;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease;

        }


        .menu-overlay.open {

            opacity: 1;

            visibility: visible;

        }

        .menu-sidebar {

            position: fixed;

            top: 0;

            left: 0;

            width: 156px;

            height: 100vh;

            background: var(--vinho-alexandria);

            z-index: 2000;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            padding: 5px 0;

            box-shadow: 2px 0 10px rgba(0,0,0,0.3);

            transform: translateX(-100%);

            transition:
                transform 0.3s ease;

        }


        /* SIDEBAR ABERTA */

        .menu-sidebar.open {

            transform: translateX(0);

        }

        .menu-sidebar-header {

            padding: 15px 10px 20px;

            text-align: center;

        }


        .menu-sidebar-header img {

            width: 90%;

            max-width: 130px;

            height: auto;

        }

        .menu-conteudo {

            display: flex;

            flex: 1;

            flex-direction: column;

        }


        .menu-side-cima {

            flex: 1;

        }


        .menu-list {

            list-style: none;

            padding: 0;

            margin: 0;

        }


        .menu-list li {

            width: 100%;

            margin-bottom: 2px;

        }


        .menu-list li a {

            display: flex;

            align-items: center;

            padding: 8px 12px;

            text-decoration: none;

            color: var(--dourado-alexandria);

            transition: all 0.2s ease;

        }


        .menu-list li a:hover {

            background: rgba(255,255,255,0.05);

            color: var(--dourado-claro);

        }

        .menu-icon-img {

            width: 18px;

            height: 18px;

            margin-right: 10px;

            object-fit: contain;

            flex-shrink: 0;

        }


        .menu-icon-fa {

            width: 18px;

            font-size: 14px;

            margin-right: 10px;

            text-align: center;

            color: var(--dourado-alexandria);

            flex-shrink: 0;

        }

        .menu-list .menu-text {

            font-size: 11px;

            font-weight: 500;

        }

        .menu-list i {
            margin-right:10px;
        }

        .menu-side-baixo {

            margin-top: auto;

        }


        .menu-side-baixo li a {

            padding: 10px 12px;

        }

        .menu-close {

            position: absolute;

            top: 5px;

            right: 5px;

            width: 25px;

            height: 25px;

            border: none;

            background: transparent;

            color: var(--dourado-alexandria);

            cursor: pointer;

            z-index: 10;

        }


        .menu-close i {

            font-size: 14px;

        }

    </style>

</head>

    <script>


        const menuButton =
            document.getElementById("menuButton");


        const menuSidebar =
            document.getElementById("menuSidebar");


        const menuOverlay =
            document.getElementById("menuOverlay");


        const menuClose =
            document.getElementById("menuClose");


        menuButton.addEventListener("click", function () {

            menuSidebar.classList.add("open");

            menuOverlay.classList.add("open");

        });


        menuClose.addEventListener("click", function () {

            menuSidebar.classList.remove("open");

            menuOverlay.classList.remove("open");

        });

        menuOverlay.addEventListener("click", function () {

            menuSidebar.classList.remove("open");

            menuOverlay.classList.remove("open");

        });

        document.addEventListener("keydown", function (event) {

            if (event.key === "Escape") {

                menuSidebar.classList.remove("open");

                menuOverlay.classList.remove("open");

            }

        });


    </script>
