<script>
(function () {
    function iniciarTopbar() {
        const wrapper = document.getElementById('topbarRoleWrapper');
        const button = document.getElementById('topbarRoleButton');

        // Evita erro de JavaScript caso o include seja usado em outra página.
        if (!wrapper || !button) return;

        button.addEventListener('click', function (event) {
            event.stopPropagation();
            const aberto = wrapper.classList.toggle('is-open');
            button.setAttribute('aria-expanded', String(aberto));
        });

        document.addEventListener('click', function (event) {
            if (!wrapper.contains(event.target)) {
                wrapper.classList.remove('is-open');
                button.setAttribute('aria-expanded', 'false');
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape') {
                wrapper.classList.remove('is-open');
                button.setAttribute('aria-expanded', 'false');
            }
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', iniciarTopbar);
    } else {
        iniciarTopbar();
    }
})();
</script>
